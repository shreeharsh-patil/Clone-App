[package]
name = "parallelnest-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "parallelnest_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
jni = "0.21.1"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
